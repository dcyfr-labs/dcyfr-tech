name: Dependabot auto-merge

# actor: bot
# Thin caller: real logic lives in the shared reusable workflow in dcyfr-labs/.github.
# Patch/minor Dependabot bumps merge once every check has finished green; major
# bumps stay open for manual review. This repo has NO ruleset and no branch
# protection (checked 2026-10-02), so main requires no checks and the shared
# workflow never arms native auto-merge (it would merge before CI). A run that
# finds CI still going withholds; dependabot-auto-merge-sweep.yml re-runs it.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: dcyfr-labs/.github/.github/workflows/dependabot-auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
