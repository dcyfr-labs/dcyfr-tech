name: Export Nexus Content

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not commit changes)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    name: Export Nexus → articles.json
    runs-on: ubuntu-latest

    steps:
      # Mint a short-lived installation token from the dcyfr-labs-release
      # App for the dcyfr/rei-workspace cross-org read. Degrade-safe: if the
      # App isn't installed in the dcyfr org yet, mint fails non-fatally and
      # the per-repo DCYFR_WORKSPACE_PAT fallback applies.
      - name: Mint App token (workspace read)
        id: workspace-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: dcyfr
          repositories: rei-workspace

      # Separate mint for PR creation (scoped to the current repo). The
      # default GITHUB_TOKEN cannot create PRs while the org-level
      # "Allow GitHub Actions to create and approve pull requests" setting is
      # disabled — using the App token bypasses that restriction centrally.
      - name: Mint App token (PR creation)
        id: pr-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout dcyfr-tech
        uses: actions/checkout@v6

      - name: Checkout dcyfr/rei-workspace (Nexus content)
        uses: actions/checkout@v6
        with:
          repository: dcyfr/rei-workspace
          # Priority: App token (central, short-lived) → per-repo PAT.
          token: ${{ steps.workspace-token.outputs.token || secrets.DCYFR_WORKSPACE_PAT }}
          path: dcyfr-workspace
          sparse-checkout: nexus

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Export Nexus content
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          node scripts/export-nexus-content.mjs \
            --nexus-root ./dcyfr-workspace/nexus \
            $DRY_RUN

      - name: Check for changes
        id: changes
        run: |
          git add -f data/articles.json
          git diff --cached --exit-code data/articles.json || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # App token (preferred) → GITHUB_TOKEN fallback. GITHUB_TOKEN only
          # works if the org allows Actions to create PRs; the App token does
          # not depend on that setting.
          token: ${{ steps.pr-token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: 'content: sync articles from Nexus'
          branch: nexus-content-sync
          title: 'content: Nexus content sync'
          body: |
            Automated content sync from dcyfr-workspace Nexus.

            This PR was created by the weekly Nexus export workflow.
            Review the changes to `data/articles.json` before merging.
          labels: content,automated
          delete-branch: true
